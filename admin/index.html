<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RawMangas Admin</title>
<link rel="stylesheet" href="admin.css">
</head>

<body>

<div id="loginScreen" class="screen">
  <div class="login-box">
    <div class="brand">Raw<span>Mangas</span></div>
    <h1>Admin Login</h1>
    <p>Enter your GitHub token to continue.</p>

    <input
      id="loginToken"
      type="password"
      placeholder="GitHub Personal Access Token"
      autocomplete="off"
    >

    <button id="loginBtn">Login</button>

    <div id="loginStatus"></div>
  </div>
</div>


<div id="adminScreen" class="hidden">

  <header class="admin-header">

    <div>
      <div class="brand">Raw<span>Mangas</span></div>
      <small>Publisher Admin</small>
    </div>

    <button id="logoutBtn" class="logout">
      Logout
    </button>

  </header>


  <main class="admin-main">

    <section class="panel">

      <div class="panel-title">
        <div>
          <h1 id="formTitle">Create New Post</h1>
          <p>Create or edit a manga chapter.</p>
        </div>

        <button id="newPostBtn" class="secondary">
          + New Post
        </button>
      </div>


      <input type="hidden" id="editingPath">


      <label>Post Title</label>
      <input
        id="postTitle"
        type="text"
        placeholder="Example: One Piece"
      >


      <label>Chapter Number</label>
      <input
        id="chapterNumber"
        type="text"
        placeholder="Example: 1176"
      >


      <label>English Slug</label>
      <input
        id="slug"
        type="text"
        placeholder="Example: one-piece-1176"
      >


      <label>Title Image</label>
      <input
        id="cover"
        type="file"
        accept="image/*"
      >

      <div id="currentCover" class="current-files"></div>


      <label>Chapter Images</label>
      <input
        id="pages"
        type="file"
        accept="image/*"
        multiple
      >

      <div class="help">
        Select multiple images. They will be uploaded in filename order.
      </div>


      <div id="existingPages" class="current-files"></div>


      <button id="publishBtn" class="publish">
        Publish New Post
      </button>

      <div id="publishStatus"></div>

    </section>


    <section class="panel">

      <div class="panel-title">
        <div>
          <h2>Existing Posts</h2>
          <p>Edit or delete published posts.</p>
        </div>

        <button id="refreshBtn" class="secondary">
          Refresh
        </button>
      </div>


      <div id="postsList">
        Loading posts...
      </div>

    </section>

  </main>

</div>


<script src="publisher.js"></script>

</body>
</html>
